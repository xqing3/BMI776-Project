name: NVIDIA Review Bot

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  bot:
    # Only run when someone writes "@bot" (and not on the bot's own comments)
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@bot')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@bot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Generate AI review and post comment
        uses: actions/github-script@v7
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: meta/llama-3.3-70b-instruct
        with:
          script: |
            const apiKey = process.env.NVIDIA_API_KEY;
            const model = process.env.NVIDIA_MODEL;
            const { owner, repo } = context.repo;

            // Ignore comments made by bots to avoid loops
            if (context.eventName === 'issue_comment'
                && context.payload.comment.user.type === 'Bot') {
              return;
            }

            // Figure out the trigger text and the issue/PR number
            let userText = '';
            let issueNumber;
            if (context.eventName === 'issues') {
              userText = context.payload.issue.body || '';
              issueNumber = context.payload.issue.number;
            } else {
              userText = context.payload.comment.body || '';
              issueNumber = context.payload.issue.number;
            }

            const issue = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber
            });
            const isPR = !!issue.data.pull_request;

            // Assemble context for the model
            let contextBlock =
              `Title: ${issue.data.title}\n\n` +
              `Description:\n${issue.data.body || '(none)'}`;

            if (isPR) {
              try {
                const diff = await github.rest.pulls.get({
                  owner, repo, pull_number: issueNumber,
                  mediaType: { format: 'diff' }
                });
                let diffText = diff.data;
                if (typeof diffText === 'string' && diffText.length > 12000) {
                  diffText = diffText.slice(0, 12000) + '\n...(diff truncated)...';
                }
                contextBlock += `\n\nThis is a Pull Request. Code diff:\n${diffText}`;
              } catch (e) {
                contextBlock += `\n\n(Could not fetch PR diff: ${e.message})`;
              }
            }

            const userRequest = userText.replace(/@bot/g, '').trim();

            const messages = [
              { role: 'system', content:
                'You are a senior software engineer acting as a GitHub review ' +
                'assistant. You review code and answer questions posted in ' +
                'issues and pull requests. Be concise, use Markdown, and give ' +
                'concrete, actionable feedback.' },
              { role: 'user', content:
                `A user mentioned you in a GitHub ${isPR ? 'pull request' : 'issue'}.\n\n` +
                `${contextBlock}\n\nThe user's request:\n` +
                `${userRequest || 'Please review this and provide feedback.'}` }
            ];

            const resp = await fetch(
              'https://integrate.api.nvidia.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model, messages, temperature: 0.2, max_tokens: 1500
                })
              });

            if (!resp.ok) {
              const errText = await resp.text();
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `🤖 **Bot error** — NVIDIA API returned ${resp.status}.\n\n` +
                      '```\n' + errText.slice(0, 800) + '\n```'
              });
              core.setFailed(`NVIDIA API error ${resp.status}`);
              return;
            }

            const data = await resp.json();
            const answer = data.choices?.[0]?.message?.content
              || '(no response from model)';

            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `🤖 **${model}** (via NVIDIA)\n\n${answer}`
            });
